<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Đăng nhập chat</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <div class="login-container">
    <div class="login-box">

      <h2>Socket Chat</h2>

      <!-- ==== AVATAR CHỌN TUỲ CHỌN ==== -->
      <div class="input-group" style="text-align:center; margin-bottom: 20px;">
        <div id="avatarPreview" 
             style="width:80px;height:80px;border-radius:50%;
             background:#f0f0f0; display:flex;
             justify-content:center; align-items:center;
             margin:0 auto 10px auto; font-size:2rem; color:#aaa;">
          +
        </div>
        <button id="chooseAvatarBtn" style="padding:8px 14px; border-radius:10px; border:none; background:#eee; cursor:pointer;">
          Chọn avatar
        </button>
        <input type="file" id="avatarInput" accept="image/*" style="display:none">
      </div>


      <!-- ==== ĐĂNG NHẬP ===== -->
      <div id="loginSection">
        <div class="input-group">
          <input type="text" id="loginName" placeholder="Tên đăng nhập..." autocomplete="off">
          <i class="input-icon bx bx-user"></i>
        </div>

        <button id="btnJoin">Đăng nhập</button>

        <p style="margin-top:15px; font-size:0.9rem; color:#777;">hoặc</p>

        <!-- Nút mở chế độ khách -->
        <button id="btnGuest" style="margin-top:10px; width:100%; padding:12px;
        background:#fff; border:2px solid #764ba2; border-radius:12px;
        cursor:pointer; font-weight:600; color:#764ba2;">
          Chế độ Khách
        </button>
      </div>


      <!-- ==== NHẬP TÊN KHÁCH ==== -->
      <div id="guestBox" style="display:none; margin-top:20px;">
        <div class="input-group">
          <input type="text" id="guestName" placeholder="Tên hiển thị...">
          <i class="input-icon bx bx-user-circle"></i>
        </div>

        <button id="guestConfirm">Vào phòng chat</button>
      </div>

      <div class="login-footer">
        © 2024 Socket Chat App
      </div>
    </div>
  </div>

  <!-- ====== SCRIPT ====== -->
  <script>
    const inputName = document.getElementById("loginName");
    const btnJoin = document.getElementById("btnJoin");

    // Avatar
    const avatarPreview = document.getElementById("avatarPreview");
    const avatarInput = document.getElementById("avatarInput");
    const chooseAvatarBtn = document.getElementById("chooseAvatarBtn");
    let avatarData = null;


    /* ==== CHỌN AVATAR ==== */
    chooseAvatarBtn.onclick = () => avatarInput.click();

    avatarInput.onchange = (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (ev) => {
        avatarPreview.style.backgroundImage = `url('${ev.target.result}')`;
        avatarPreview.style.backgroundSize = "cover";
        avatarPreview.style.color = "transparent";
        avatarData = ev.target.result;
      };
      reader.readAsDataURL(file);
    };


    /* ==== ĐĂNG NHẬP THƯỜNG ==== */
    btnJoin.onclick = () => {
      const name = inputName.value.trim();
      if (name === "") {
        inputName.style.borderColor = "red";
        return;
      }

      localStorage.setItem("chat_username", name);
      if (avatarData)
        localStorage.setItem("chat_avatar", avatarData);

      localStorage.removeItem("isGuest");
      localStorage.removeItem("guestName");

      window.location.href = "index.html";
    };


    /* ==== CHẾ ĐỘ KHÁCH ==== */
    document.getElementById("btnGuest").onclick = () => {
      document.getElementById("loginSection").style.display = "none";
      document.getElementById("guestBox").style.display = "block";
    };

    document.getElementById("guestConfirm").onclick = () => {
      const guestName = document.getElementById("guestName").value.trim();
      if (guestName === "") {
        alert("Vui lòng nhập tên khách!");
        return;
      }

      localStorage.setItem("guestName", guestName);
      localStorage.setItem("isGuest", "true");

      window.location.href = "index.html";
    };
  </script>
</body>
</html>
