<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Đăng nhập - Socket Chat</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
  
  <style>
    /* (giữ nguyên style đã có trong file gốc, rút gọn cho ngắn gọn) */
    *{box-sizing:border-box;margin:0;padding:0;font-family:'Poppins',sans-serif}
    body{height:100vh;display:flex;justify-content:center;align-items:center;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%)}
    .login-container{padding:20px;width:100%;display:flex;justify-content:center}
    .login-box{background:#fff;padding:3rem 2.5rem;border-radius:20px;box-shadow:0 10px 30px rgba(0,0,0,.15);text-align:center;max-width:420px;width:100%}
    .login-box h2{margin-bottom:1.25rem;color:#333;font-weight:600;font-size:1.5rem}
    .input-group{position:relative;margin-bottom:1rem}
    .input-group input{width:100%;padding:12px 14px 12px 44px;border:2px solid #eee;border-radius:10px;font-size:1rem;background:#f9f9f9}
    .input-icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:#aaa}
    #btnJoin{width:100%;padding:12px;border-radius:10px;background:linear-gradient(90deg,#667eea,#764ba2);color:#fff;border:0;font-weight:600;cursor:pointer}
    .avatar-select{display:flex;align-items:center;gap:12px;justify-content:center;margin-bottom:1rem}
    .avatar-preview{width:60px;height:60px;border-radius:50%;background:#f1f1f1;border:2px dashed #ccc;display:flex;align-items:center;justify-content:center;font-size:1.5rem;color:#aaa;overflow:hidden;background-size:cover;background-position:center}
    .auth-switch{margin-top:0.75rem;display:flex;justify-content:center;gap:8px;color:#666;font-size:.9rem}
    .auth-switch button{border:none;background:none;color:#667eea;font-weight:600;cursor:pointer}
  </style>
</head>
<body>
  <div class="login-container">
    <div class="login-box">

      <h2 id="title">Tham gia Chat</h2>

      <div class="input-group">
        <input type="text" id="loginName" placeholder="Nhập tên của bạn..." autocomplete="off" />
        <svg class="input-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
      </div>

      <div class="input-group">
        <input type="email" id="loginEmail" placeholder="Nhập email của bạn..." autocomplete="off" />
        <svg class="input-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="20" height="16" rx="2"></rect><polyline points="22,6 12,13 2,6"></polyline></svg>
      </div>

      <!-- MẬT KHẨU -->
      <div class="input-group">
        <input type="password" id="loginPassword" placeholder="Mật khẩu..." autocomplete="off" />
        <svg class="input-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
      </div>

      <div class="input-group" id="confirmGroup" style="display:none">
        <input type="password" id="registerPasswordConfirm" placeholder="Xác nhận mật khẩu (khi đăng ký)" autocomplete="off" />
        <svg class="input-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11V7a5 5 0 0 1 10 0v4"></path></svg>
      </div>

      <!-- CHỌN AVATAR - chỉ hiển thị khi đăng ký -->
      <div class="avatar-select" id="avatarGroup" style="display:none">
        <div id="avatarPreview" class="avatar-preview">+</div>
        <div style="display:flex;flex-direction:column;gap:6px">
          <button type="button" id="btnChooseAvatar">Tải avatar (chọn file)</button>
          <button type="button" id="btnClearAvatar">xóa avatar</button>
          <input type="file" id="avatarInput" accept="image/*" style="display:none">
        </div>
      </div>

      <button id="btnJoin">Vào phòng ngay</button>

      <div class="auth-switch">
        <span id="authHint">Chưa có tài khoản?</span>
        <button type="button" id="btnToggleAuth">Đăng ký</button>
      </div>

      <div class="login-footer" style="margin-top:12px;color:#888;font-size:.85rem">© 2025 Socket Chat App</div>
    </div>
  </div>

  <script>
    const USERS_KEY = 'chat_users';
    const btnJoin = document.getElementById('btnJoin');
    const inputName = document.getElementById('loginName');
    const emailInput = document.getElementById('loginEmail');
    const passInput = document.getElementById('loginPassword');
    const passConfirmInput = document.getElementById('registerPasswordConfirm');
    const avatarInput = document.getElementById('avatarInput');
    const avatarPreview = document.getElementById('avatarPreview');
    const btnChooseAvatar = document.getElementById('btnChooseAvatar');
    const btnClearAvatar = document.getElementById('btnClearAvatar');
    const btnToggleAuth = document.getElementById('btnToggleAuth');
    const authHint = document.getElementById('authHint');
    const titleEl = document.getElementById('title');
    const confirmGroup = document.getElementById('confirmGroup');
    const avatarGroup = document.getElementById('avatarGroup');

    let authMode = 'login'; // 'login' | 'register'
    let avatarDataUrl = null;

    function loadUsers() {
      try { return JSON.parse(localStorage.getItem(USERS_KEY)) || []; }
      catch (e) { return []; }
    }
    function saveUsers(list) { localStorage.setItem(USERS_KEY, JSON.stringify(list)); }

    function setAuthMode(mode){
      authMode = mode;
      if(mode === 'login'){
        titleEl.textContent = 'Đăng nhập Chat';
        btnJoin.textContent = 'Đăng nhập';
        authHint.textContent = 'Chưa có tài khoản?';
        btnToggleAuth.textContent = 'Đăng ký';
        confirmGroup.style.display = 'none';
        avatarGroup.style.display = 'none';
        inputName.style.display = 'none';
      } else {
        titleEl.textContent = 'Đăng ký tài khoản mới';
        btnJoin.textContent = 'Đăng ký & vào chat';
        authHint.textContent = 'Đã có tài khoản?';
        btnToggleAuth.textContent = 'Đăng nhập';
        confirmGroup.style.display = 'block';
        avatarGroup.style.display = 'flex';
        inputName.style.display = 'block';
      }
      passConfirmInput.value = '';
    }

    btnToggleAuth.addEventListener('click', () => setAuthMode(authMode === 'login' ? 'register' : 'login'));
    setAuthMode('login');

    btnChooseAvatar.addEventListener('click', () => avatarInput.click());
    btnClearAvatar.addEventListener('click', () => {
      avatarDataUrl = null;
      avatarPreview.style.backgroundImage = 'none';
      avatarPreview.textContent = '+';
      avatarInput.value = '';
    });

    avatarInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if(!file) return;
      const reader = new FileReader();
      reader.onload = (ev) => {
        avatarDataUrl = ev.target.result;
        avatarPreview.style.backgroundImage = `url(${ev.target.result})`;
        avatarPreview.textContent = '';
        avatarPreview.style.borderStyle = 'solid';
      };
      reader.readAsDataURL(file);
    });

    function handleAuthSubmit(){
      const name = inputName.value.trim();
      const email = emailInput.value.trim().toLowerCase();
      const pass = passInput.value;
      const pass2 = passConfirmInput.value;

      if(!email){ alert('Vui lòng nhập email!'); emailInput.focus(); return; }
      if(!pass){ alert('Vui lòng nhập mật khẩu!'); passInput.focus(); return; }

      const users = loadUsers();

      if(authMode === 'register'){
        if(!name){ alert('Vui lòng nhập tên hiển thị!'); inputName.focus(); return; }
        if(pass.length < 6){ alert('Mật khẩu phải tối thiểu 6 ký tự!'); passInput.focus(); return; }
        if(pass !== pass2){ alert('Xác nhận mật khẩu không khớp!'); passConfirmInput.focus(); return; }
        if(users.some(u => u.email === email)){ alert('Email này đã được đăng ký'); return; }

        users.push({ name, email, password: pass, avatar: avatarDataUrl || null });
        saveUsers(users);

        localStorage.setItem('chat_username', name);
        localStorage.setItem('chat_email', email);
        if(avatarDataUrl) localStorage.setItem('chat_avatar', avatarDataUrl);

        btnJoin.textContent = 'Đang tạo tài khoản...';
        btnJoin.disabled = true;
        setTimeout(() => window.location.href = '/', 300);
      } else {
        const user = users.find(u => u.email === email);
        if(!user){ alert('Không tìm thấy tài khoản với email này. Hãy đăng ký trước.'); return; }
        if(user.password !== pass){ alert('Mật khẩu không đúng!'); return; }

        localStorage.setItem('chat_username', user.name || name || email);
        localStorage.setItem('chat_email', user.email);
        if(user.avatar) localStorage.setItem('chat_avatar', user.avatar);

        btnJoin.textContent = 'Đang đăng nhập...';
        btnJoin.disabled = true;
        setTimeout(() => window.location.href = '/', 300);
      }
    }

    btnJoin.addEventListener('click', (e) => { e.preventDefault(); handleAuthSubmit(); });
    [inputName, emailInput, passInput, passConfirmInput].forEach(el => {
      el && el.addEventListener('keypress', (e) => { if(e.key === 'Enter'){ e.preventDefault(); handleAuthSubmit(); } });
    });
  </script>
</body>
</html>
